<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Sign in to your private VitaWise health space.">
  <title>Sign In — VitaWise</title>
  <link rel="icon" href="./assets/icon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./css/tokens.css?v=8.0.0">
  <link rel="stylesheet" href="./css/vitawise.css?v=8.0.0">
  <link rel="stylesheet" href="./css/auth.css?v=8.0.0">
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <style>
    .vw-intro-overlay {
      position: fixed;
      z-index: 2147483647;
      inset: 0;
      display: grid;
      place-items: center;
      overflow: hidden;
      background: #FFFFFF;
    }

    .vw-intro-overlay[hidden] { display: none; }

    .vw-intro-video {
      width: 100%;
      height: 100%;
      max-width: 100vw;
      max-height: 100vh;
      object-fit: contain;
      object-position: center;
      transform: scale(0.62);
      transform-origin: center;
      transition: transform 0.3s ease;
      mix-blend-mode: multiply;
      border: none;
      outline: none;
      box-shadow: 0 0 0 12px #FFFFFF;
    }

    .vw-intro-start {
      position: absolute;
      bottom: 2rem;
      padding: 0.85rem 1.75rem;
      border: 0;
      border-radius: 12px;
      color: #ffffff;
      background: #710014;
      font: 600 0.95rem/1.2 Inter, sans-serif;
      cursor: pointer;
      box-shadow: 0 4px 16px rgba(113, 0, 20, 0.35);
      transition: transform 0.2s ease, background 0.2s ease;
    }

    .vw-intro-start:hover {
      background: #580010;
      transform: translateY(-2px);
    }

    .vw-btn-link-subtle:hover {
      background: rgba(113, 0, 20, 0.06);
      text-decoration: underline;
    }
  </style>
</head>
<body class="vw-auth-page">
  <div class="vw-intro-overlay" id="nriit-intro" aria-label="NRIIT introduction">
    <video class="vw-intro-video" id="nriit-intro-video" playsinline preload="auto">
      <source src="./assets/nriit-intro.mp4" type="video/mp4">
    </video>
    <button class="vw-intro-start" id="nriit-intro-start" type="button" hidden>Play intro</button>
  </div>
  <script>
    (() => {
      const completionKey = 'nriit_intro_completed';
      const intro = document.getElementById('nriit-intro');
      const video = document.getElementById('nriit-intro-video');
      const startButton = document.getElementById('nriit-intro-start');
      let complete;

      window.addEventListener('keydown', (event) => {
        const key = typeof event.key === 'string' ? event.key.toLowerCase() : '';
        if (!event.ctrlKey || !event.shiftKey || (key !== 'r' && key !== 'f5')) return;

        event.preventDefault();
        try {
          localStorage.removeItem(completionKey);
        } catch (_) {}
        window.location.reload();
      }, { capture: true });

      window.VitaWiseIntroReady = new Promise((resolve) => {
        const finish = (markCompleted) => {
          if (!intro || intro.hidden) return;
          if (markCompleted) {
            try {
              localStorage.setItem(completionKey, 'true');
            } catch (_) {}
          }
          intro.hidden = true;
          if (video) video.pause();
          resolve();
        };
        complete = () => finish(true);

        try {
          if (localStorage.getItem(completionKey) === 'true') {
            if (intro) intro.hidden = true;
            resolve();
            return;
          }
        } catch (_) {}

        if (video) {
          video.addEventListener('ended', complete, { once: true });
          video.addEventListener('error', () => finish(false), { once: true });
        }

        const playIntro = () => {
          if (startButton) startButton.hidden = true;
          if (video) {
            video.play().catch(() => {
              if (startButton) startButton.hidden = false;
            });
          }
        };

        if (startButton) startButton.addEventListener('click', playIntro);
        playIntro();
      });
    })();
  </script>
  <!-- Top Professional Header Bar -->
  <header class="vw-auth-topbar">
    <div class="vw-auth-topbar-inner">
      <a href="./index.html" class="vw-auth-logo" aria-label="VitaWise">
        <span class="vw-auth-logo-icon">
          <svg viewBox="0 0 512 512" width="22" height="22" fill="none" style="display: block;">
            <g fill="#FFFFFF">
              <path d="M 112 256 V 184 C 112 144, 144 112, 184 112 H 208 V 256 H 112 Z" />
              <path d="M 184 256 H 208 V 376 C 208 416, 176 448, 136 448 C 120 448, 112 440, 112 424 C 112 408, 120 400, 136 400 C 162 400, 184 378, 184 352 V 256 Z" />
              <path d="M 208 256 L 344 112 H 392 C 416 112, 432 128, 432 152 V 256 H 336 L 208 384 V 256 Z" />
            </g>
          </svg>
        </span>
        <div class="vw-auth-logo-text">
          <span class="vw-auth-brand-name"><span class="vw-brand-vita">Vita</span><span class="vw-brand-wise">Wise</span></span>
          <span class="vw-auth-brand-caption">HEALTH INTELLIGENCE</span>
        </div>
      </a>
      <div class="vw-auth-topbar-right">
        <button class="vw-lang-toggle" id="auth-lang-toggle" type="button" aria-label="Toggle language between English and Telugu">
          <svg class="vw-lang-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor"
            stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10" />
            <line x1="2" y1="12" x2="22" y2="12" />
            <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z" />
          </svg>
          <span id="auth-lang-label">EN</span>
        </button>
      </div>
    </div>
  </header>

  <!-- Main Card -->
  <main class="vw-auth-body">
    <section class="vw-auth-card">
      <div class="vw-auth-card-header">
        <span class="vw-eyebrow" id="login-eyebrow">Welcome Back</span>
        <h1 id="login-title">Sign In to Your Space</h1>
        <p id="login-subtitle">Access your personal health logs, cycle patterns, and nutrition insights.</p>
      </div>

      <div id="auth-alert" class="vw-alert hidden" role="alert"></div>

      <!-- Google Social Authentication -->
      <div class="vw-social-auth">
        <button type="button" class="vw-google-btn" data-google-auth="login">
          <svg class="vw-google-icon" viewBox="0 0 24 24" width="20" height="20" xmlns="http://www.w3.org/2000/svg">
            <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
            <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
            <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
            <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
          </svg>
          <span id="login-google-text">Continue with Google</span>
        </button>
      </div>

      <div class="vw-auth-divider">
        <span id="login-divider-text">or sign in with family credentials</span>
      </div>

      <form data-auth-form="login" novalidate>
        <div class="vw-form-group">
          <label class="vw-label" for="email">
            <span id="lbl-login-email">Family Email Address</span> <span style="font-weight: 400; color: var(--text-secondary);">(e.g. family@example.com)</span>
          </label>
          <input class="vw-input" id="email" name="email" type="email" placeholder="family@example.com" autocomplete="email" required>
        </div>

        <div class="vw-form-group">
          <div class="vw-label">
            <span id="lbl-login-password">Your Password</span>
            <a href="./forgot-password.html" class="vw-text-link" id="forgot-password-link">Forgot password?</a>
          </div>
          <div class="vw-password-wrap">
            <input class="vw-input" id="password" name="password" type="password" placeholder="••••••••" autocomplete="current-password" required>
            <button type="button" class="vw-password-toggle" data-password-toggle="password">Show</button>
          </div>
        </div>

        <button class="vw-btn vw-btn-primary vw-btn-block vw-btn-lg" type="submit" id="submit-btn">
          <span id="btn-text-login">Sign In to Your Space</span>
        </button>

      </form>
    </section>

    <!-- Centered section below the Login Card: side by side -->
    <div class="vw-auth-below-card" style="text-align: center; margin-top: 1.25rem; display: flex; flex-direction: row; justify-content: center; align-items: center; gap: 0.5rem; flex-wrap: wrap;">
      <span id="prompt-new-to-vitawise" style="font-size: 0.95rem; color: var(--text-secondary);">New to VitaWise?</span>
      <a href="./signup.html" class="vw-btn-link-subtle" id="btn-login-to-signup" style="background: none; border: none; color: #710014; font-family: inherit; font-size: 0.95rem; font-weight: 600; text-decoration: none; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 0.25rem; padding: 0.35rem 0.65rem; border-radius: 6px; transition: color 0.15s ease, background 0.15s ease;">Create Account</a>
    </div>
  </main>

  <!-- Footer Branding -->
  <footer class="vw-brand-footer">
    <div class="vw-brand-signature">
      <img src="./assets/aloka-logo.png" alt="Aloka Logo" class="vw-brand-logo">
      <span class="vw-brand-text">Powered by <strong>Aloka</strong></span>
    </div>
  </footer>

  <script src="./js/api.js?v=2.8.0"></script>
  <script src="./js/i18n-engine.js?v=2.8.0"></script>
  <script src="./js/auth.js?v=2.8.0"></script>
</body>
</html>
