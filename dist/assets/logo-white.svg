<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 84" width="360" height="84" fill="none">
  <defs>
    <linearGradient id="logo-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F0F1A" />
      <stop offset="100%" stop-color="#1E1B4B" />
    </linearGradient>
  </defs>

  <!-- Left Logo Icon Tile -->
  <g transform="translate(6, 6)">
    <rect width="72" height="72" rx="18" fill="url(#logo-bg)" />
    <rect width="70" height="70" x="1" y="1" rx="17" stroke="#4F46E5" stroke-width="1.5" stroke-opacity="0.4" />

    <!-- Royal Geometric Monogram Emblem -->
    <g transform="translate(7, 7) scale(0.114)" fill="#FFFFFF">
      <path d="M 112 256 V 184 C 112 144, 144 112, 184 112 H 208 V 256 H 112 Z" />
      <path d="M 184 256 H 208 V 376 C 208 416, 176 448, 136 448 C 120 448, 112 440, 112 424 C 112 408, 120 400, 136 400 C 162 400, 184 378, 184 352 V 256 Z" />
      <path d="M 208 256 L 344 112 H 392 C 416 112, 432 128, 432 152 V 256 H 336 L 208 384 V 256 Z" />
    </g>
  </g>

  <!-- Typography Wordmark for Dark Backgrounds -->
  <g transform="translate(94, 46)">
    <text font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
          font-weight="800" 
          font-size="34" 
          letter-spacing="-0.04em" 
          fill="#FFFFFF">Vita<tspan fill="#818CF8">Wise</tspan></text>
  </g>
  <g transform="translate(96, 64)">
    <text font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
          font-weight="700" 
          font-size="9.5" 
          letter-spacing="0.22em" 
          fill="#C7D2FE">HEALTH INTELLIGENCE</text>
  </g>
</svg>
