<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Reset your VitaWise account password.">
  <title>Reset Password — VitaWise</title>
  <link rel="icon" href="./assets/icon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./css/tokens.css?v=2.4.0">
  <link rel="stylesheet" href="./css/vitawise.css?v=2.4.0">
  <link rel="stylesheet" href="./css/auth.css?v=2.4.0">
</head>
<body class="vw-auth-page">
  <!-- Top Professional Header Bar -->
  <header class="vw-auth-topbar">
    <div class="vw-auth-topbar-inner">
      <a href="./index.html" class="vw-auth-logo" aria-label="VitaWise">
        <span class="vw-auth-logo-icon">
          <svg viewBox="0 0 512 512" width="22" height="22" fill="none" style="display: block;">
            <g fill="#FFFFFF">
              <path d="M 112 256 V 184 C 112 144, 144 112, 184 112 H 208 V 256 H 112 Z" />
              <path d="M 184 256 H 208 V 376 C 208 416, 176 448, 136 448 C 120 448, 112 440, 112 424 C 112 408, 120 400, 136 400 C 162 400, 184 378, 184 352 V 256 Z" />
              <path d="M 208 256 L 344 112 H 392 C 416 112, 432 128, 432 152 V 256 H 336 L 208 384 V 256 Z" />
            </g>
          </svg>
        </span>
        <div class="vw-auth-logo-text">
          <span class="vw-auth-brand-name"><span class="vw-brand-vita">Vita</span><span class="vw-brand-wise">Wise</span></span>
          <span class="vw-auth-brand-caption">HEALTH INTELLIGENCE</span>
        </div>
      </a>
      <div class="vw-auth-topbar-right">
        <a href="./login.html" class="vw-auth-topbar-btn secondary">← Back to Sign In</a>
      </div>
    </div>
  </header>

  <main class="vw-auth-body">
    <section class="vw-auth-card">
      <div class="vw-auth-card-header">
        <span class="vw-eyebrow">Account Recovery</span>
        <h1>Reset Password</h1>
        <p>Enter your registered email address and we will send secure recovery instructions.</p>
      </div>

      <div id="auth-alert" class="vw-alert hidden" role="alert"></div>

      <form data-auth-form="forgot" novalidate>
        <div class="vw-form-group">
          <label class="vw-label" for="email">Email Address</label>
          <input class="vw-input" id="email" name="email" type="email" placeholder="uday90925@gmail.com" autocomplete="email" required>
        </div>

        <button class="vw-btn vw-btn-primary vw-btn-block vw-btn-lg" type="submit" id="submit-btn">
          <span>Send Recovery Email</span>
        </button>
      </form>
    </section>
  </main>

  <footer class="vw-auth-footer">
    <p>© 2026 VitaWise · Evidence-Aware Health Intelligence</p>
  </footer>

  <script src="./js/api.js?v=2.1.6"></script>
  <script src="./js/auth.js?v=2.1.6"></script>
</body>
</html>
